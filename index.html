<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byangabo Martial Arts - Kwiyandikisha</title>
  <style>
    body { font-family: Arial; background: #000; color: #fff; padding: 20px; max-width: 700px; margin: auto; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo img { width: 250px; }
    h1 { color: #FFD700; text-align: center; }
    h2 { color: #FFD700; border-bottom: 2px solid #FFD700; padding-bottom: 5px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; background: #222; color: #fff; border: 1px solid #FFD700; border-radius: 5px; }
    button { background: #FFD700; color: #000; padding: 15px; width: 100%; border: none; font-weight: bold; font-size: 18px; cursor: pointer; border-radius: 5px; }
    .info { background: #111; padding: 15px; border-left: 4px solid #FFD700; margin: 20px 0; }
  </style>
</head>
<body>

  <div class="logo">
    <h1>BYANGABO MARTIAL ARTS</h1>
    <p>Thieu lam giao long • BLACK SCORPION • MUSANZE</p>
    <p><b>Sifu: 0788666966</b></p>
  </div>

  <h2>Kwiyandikisha — Membership Registration Form</h2>

  <form name="kwiyandikisha" method="POST" data-netlify="true">
    
    <div class="form-group">
      <label>Amazina yose *</label>
      <input type="text" name="amazina" required />
    </div>

    <div class="form-group">
      <label>Imyaka *</label>
      <input type="number" name="imyaka" required />
    </div>

    <div class="form-group">
      <label>Igisina</label>
      <select name="igisina">
        <option>Gabo</option>
        <option>Gore</option></select>
  </div>

  <div class="form-group">
    <label>Numero ya telephone *</label>
    <input type="tel" name="telephone" required />
  </div>

  <div class="info">
    <p><b>Monthly fee: 10,000 FRW</b></p>
    <p><b>Uniform: 25,000 FRW</b></p>
  </div>

  <button type="submit">OHEREZA KWANDIKISHA 👊</button>
</form>

</body>
</html>
