<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byangabo Martial Arts - Kwiyandikisha</title>
  <style>
    body { font-family: Arial; background: #f2f2f2; padding: 20px; text-align: center; }
    .container { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; }
    h1 { color: #d32f2f; }
    h2 { letter-spacing: 5px; }
    .info { background: #fff3cd; padding: 10px; border-radius: 5px; margin: 10px 0; }
    input, button { width: 90%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #d32f2f; color: white; border: none; font-weight: bold; }
    .contact { margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Byangabo Martial Arts</h1>
    <h2>Si Fu</h2>
    
    <div class="info">
      <b>Aho tubarizwa:</b> Musanze - Byangabo <br>
      <b>Airtel:</b> 0722 288 878
    </div>

    <h3>Iyandikishe hano</h3>
    <form name="registration" method="POST" data-netlify="true">
      <input type="text" name="izina" placeholder="Amazina yawe" required>
      <input type="tel" name="telefone" placeholder="Numero ya telefone" required>
      <input type="text" name="imyaka" placeholder="Imyaka">
      <button type="submit">Ohereza Kwiyandikisha</button>
    </form>

    <div class="contact">
      <h4>Kwishyura bikorwa hano:</h4>
      <b>0782 748 795</b> <br>
      <b>2037788</b>
    </div>
  </div>
</body>
</html>
